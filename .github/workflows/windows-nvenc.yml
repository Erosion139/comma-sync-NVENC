name: Windows build (NVENC)

# Builds JUST the Windows app and hands you the installer as a downloadable
# artifact — no tag, no release, nothing published. Run it from the repo's
# Actions tab: "Windows build (NVENC)" -> "Run workflow".
#
# The upstream release.yml still works if you'd rather tag a full release; this
# is the low-ceremony path for a personal fork.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    name: Build the Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: stable

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: gui/src-tauri

      - name: Build the Go core as a Tauri sidecar
        shell: bash
        working-directory: core
        run: |
          go vet ./...
          triple="$(rustc -vV | sed -n 's/^host: //p')"
          mkdir -p ../gui/src-tauri/binaries
          go build -trimpath -ldflags "-s -w" \
            -o "../gui/src-tauri/binaries/comma-sync-${triple}.exe" .

      - name: Build the installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: gui/src-tauri

      - name: Upload the installer
        uses: actions/upload-artifact@v4
        with:
          name: comma-sync-nvenc-windows
          if-no-files-found: error
          path: |
            gui/src-tauri/target/release/bundle/nsis/*.exe
            gui/src-tauri/target/release/bundle/msi/*.msi
